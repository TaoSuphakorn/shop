apiVersion: v1
kind: Service
metadata:
  name: web
  labels: { app.kubernetes.io/name: web }
spec:
  selector: { app.kubernetes.io/name: web }
  ports:
    - { name: http, port: 3000, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels: { app.kubernetes.io/name: web }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: web }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: web }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000           # "node" in the image; numeric so runAsNonRoot can be verified
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: shop-web:local
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 3000 }
          env:
            # Used by the server-side first render to fetch products inside the cluster.
            - { name: API_ORIGIN, value: "http://api.shop.svc:8080" }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          readinessProbe:
            httpGet: { path: /products/placeholder.svg, port: http }   # static file: does not depend on the API
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /products/placeholder.svg, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: next-cache, mountPath: /app/.next/cache }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: next-cache, emptyDir: {} }
