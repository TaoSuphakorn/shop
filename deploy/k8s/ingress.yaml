# Traefik is the load balancer in front of everything: TLS, rate limiting, security headers.
# The Content-Security-Policy is NOT set here: the web app sets it per request with a nonce (spec 11.3).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ratelimit
spec:
  rateLimit:          # about 100 requests per 10 seconds per client IP
    average: 10
    period: 1s
    burst: 100
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: headers
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    contentTypeNosniff: true
    referrerPolicy: strict-origin-when-cross-origin
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: shop-ratelimit@kubernetescrd,shop-headers@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: [shop.localhost]
      secretName: shop-tls
  rules:
    - host: shop.localhost
      http:
        paths:
          - { path: /api, pathType: Prefix, backend: { service: { name: api, port: { name: http } } } }
          - { path: /, pathType: Prefix, backend: { service: { name: web, port: { name: http } } } }
---
# Plain HTTP only ever answers with a redirect to HTTPS.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop-http
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: shop-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: shop.localhost
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: web, port: { name: http } } } }
