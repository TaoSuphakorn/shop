# Single SQL Server for dev/demo. In production use a managed database or an availability group
# and point ConnectionStrings__Shop at it instead (spec 13).
apiVersion: v1
kind: Service
metadata:
  name: mssql
  labels: { app.kubernetes.io/name: mssql }
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: mssql }
  ports:
    - { name: tds, port: 1433 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mssql
  labels: { app.kubernetes.io/name: mssql }
spec:
  serviceName: mssql
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: mssql }
  template:
    metadata:
      labels: { app.kubernetes.io/name: mssql }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001        # "mssql" in the image
        fsGroup: 10001          # lets that user write the volume
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: mssql
          image: mcr.microsoft.com/mssql/server:2022-latest
          ports:
            - { name: tds, containerPort: 1433 }
          env:
            - { name: ACCEPT_EULA, value: "Y" }
            - name: MSSQL_SA_PASSWORD
              valueFrom: { secretKeyRef: { name: shop-secrets, key: MSSQL_SA_PASSWORD } }
          resources:
            requests: { cpu: "1", memory: 2Gi }
            limits: { memory: 3Gi }
          readinessProbe:
            tcpSocket: { port: tds }
            initialDelaySeconds: 15
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            # The sqlservr binary carries the NET_BIND_SERVICE file capability; without it in the
            # bounding set the process cannot even start ("Operation not permitted").
            capabilities: { drop: [ALL], add: [NET_BIND_SERVICE] }
          volumeMounts:
            - { name: data, mountPath: /var/opt/mssql }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 5Gi } }
