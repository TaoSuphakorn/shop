# docker compose up -d                  -> infrastructure only (SQL Server, Kafka) for local development
# docker compose --profile app up -d    -> the whole system, then open http://localhost:3000
# Ports are bound to 127.0.0.1 so nothing is reachable from the network.
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "127.0.0.1:9094:9094"   # for an API running on the host; containers use kafka:9092
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  migrate:
    profiles: [app]
    build: ./backend
    image: shop-api:local
    command: ["migrate"]
    environment:
      ConnectionStrings__Shop: Server=mssql,1433;Database=Shop;User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    depends_on:
      mssql: { condition: service_healthy }

  api:
    profiles: [app]
    image: shop-api:local
    environment:
      # Least-privilege login created by the migrate step; the API never connects as sa.
      ConnectionStrings__Shop: Server=mssql,1433;Database=Shop;User Id=shop_app;Password=${APP_DB_PASSWORD};Encrypt=True;TrustServerCertificate=True
      CART_SIGNING_KEY: ${CART_SIGNING_KEY:?set CART_SIGNING_KEY in .env}
      Kafka__BootstrapServers: kafka:9092
      # ForwardedHeaders__KnownNetworks is deliberately not set: the web container passes a client-supplied
      # X-Forwarded-For through, so trusting it would let anyone dodge the rate limits with a fake header.
      # Every request therefore counts as one client here. Raise these for load tests:
      # RateLimit__CartPerMinute: 30
      # RateLimit__CheckoutPerMinute: 5
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      kafka: { condition: service_healthy }

  web:
    profiles: [app]
    build: ./frontend
    image: shop-web:local
    environment:
      API_ORIGIN: http://api:8080
    ports:
      - "127.0.0.1:3000:3000"
    read_only: true
    tmpfs: [/tmp, /app/.next/cache]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on: [api]

volumes:
  mssql-data:
